<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e3a4a"/>
      <stop offset="100%" stop-color="#08222e"/>
    </linearGradient>
    <linearGradient id="fishGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#06b6d4" stroke-width="8" opacity="0.8"/>
  <circle cx="256" cy="256" r="208" fill="url(#circleGrad)"/>

  <!-- Stylized Fish -->
  <g transform="translate(256, 210)">
    <!-- Tail Fin -->
    <path d="M-110,0 L-160,-40 C-150,-10 -150,10 -160,40 Z" fill="url(#fishGrad)"/>
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="120" ry="50" fill="url(#fishGrad)"/>
    <!-- Top Fin -->
    <path d="M-20,-48 Q20,-80 50,-46 Z" fill="#d97706"/>
    <!-- Bottom Fin -->
    <path d="M-10,48 Q20,75 40,46 Z" fill="#d97706"/>
    <!-- Gills -->
    <path d="M45,-25 Q35,0 45,25" fill="none" stroke="#b45309" stroke-width="5" stroke-linecap="round"/>
    <!-- Eye -->
    <circle cx="75" cy="-12" r="10" fill="#0f172a"/>
    <circle cx="78" cy="-14" r="3" fill="#ffffff"/>
  </g>

  <!-- Badge / Monogram -->
  <rect x="126" y="316" width="260" height="72" rx="20" fill="url(#emeraldGrad)" filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.5))"/>
  <rect x="130" y="320" width="252" height="64" rx="16" fill="none" stroke="#6ee7b7" stroke-width="2"/>
  <text x="256" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">KV DRYFISH</text>
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">KULUMANI • TRICHY</text>
</svg>